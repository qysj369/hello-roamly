# 腾讯云轻量：HTTPS + HTTP 跳转 + API 反代
# 安装：sudo cp deploy/nginx-lighthouse-ssl.conf /etc/nginx/conf.d/hello-roamly.conf
# 证书：/etc/nginx/ssl/helloroamly.com/ （见 deploy/ssl-setup.sh）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS 永久跳转
server {
    listen 80;
    server_name helloroamly.com www.helloroamly.com;
    return 301 https://$host$request_uri;
}

# IP 直连仍走 HTTP（便于调试；有域名证书后建议关闭）
server {
    listen 80;
    server_name 49.232.221.38;
    root /var/www/hello-roamly/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /home { return 301 /; }
    location = /me { return 301 /profile; }
    location = /chat { return 301 /ai; }
    location = /explore { return 301 /discover; }
    location = /guide { return 301 /guides; }
    location = /plan { return 301 /discover; }

    location /api/ {
        client_max_body_size 80m;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 低空飞行卫星瓦片。浏览器直连高德会被 Referer 拒绝。
    location ~ ^/cesium-sat/amap/(?:r2/)?(?<tz>\d+)/(?<tx>\d+)/(?<ty>\d+)(?:\.(?:jpg|jpeg|png))?$ {
        resolver 223.5.5.5 119.29.29.29 valid=300s;
        proxy_pass https://webst01.is.autonavi.com/appmaptile?style=6&x=$tx&y=$ty&z=$tz;
        proxy_set_header Referer https://www.amap.com/;
        proxy_set_header User-Agent "Mozilla/5.0 HelloRoamlySnailFlight";
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

server {
    listen 443 ssl http2;
    server_name helloroamly.com www.helloroamly.com;
    root /var/www/hello-roamly/dist;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/helloroamly.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/helloroamly.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /home { return 301 /; }
    location = /me { return 301 /profile; }
    location = /chat { return 301 /ai; }
    location = /explore { return 301 /discover; }
    location = /guide { return 301 /guides; }
    location = /plan { return 301 /discover; }

    location /api/ {
        client_max_body_size 80m;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # 低空飞行卫星瓦片。浏览器直连高德会被 Referer 拒绝。
    location ~ ^/cesium-sat/amap/(?:r2/)?(?<tz>\d+)/(?<tx>\d+)/(?<ty>\d+)(?:\.(?:jpg|jpeg|png))?$ {
        resolver 223.5.5.5 119.29.29.29 valid=300s;
        proxy_pass https://webst01.is.autonavi.com/appmaptile?style=6&x=$tx&y=$ty&z=$tz;
        proxy_set_header Referer https://www.amap.com/;
        proxy_set_header User-Agent "Mozilla/5.0 HelloRoamlySnailFlight";
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
