# 示例：Nginx 托管 dist/（含 SSG 预渲染子目录）
# 将 root 指向构建产物目录，例如 /var/www/hello-roamly/dist

server {
    listen 80;
    server_name example.com;
    root /var/www/hello-roamly/dist;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 永久重定向（与 vercel.json / _redirects 一致）
    location = /home { return 301 /; }
    location = /me { return 301 /profile; }
    location = /chat { return 301 /ai; }
    location = /explore { return 301 /discover; }
    location = /guide { return 301 /guides; }
    location = /plan { return 301 /discover; }

    location / {
        # 先尝试精确路径与目录 index.html，再回退 SPA 根 index
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
